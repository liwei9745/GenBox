name: Master PR Quality Gate

on:
  pull_request:
    branches: ["master"]
  push:
    branches: ["codex/phase6-ci-convergence-20260809"]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  quality:
    name: Test pull request
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      - name: Validate JavaScript
        run: |
          node --check static/js/i18n.js
          node --check static/js/app-all.js
          node --check static/js/extensions.js
          node --check static/js/sync.js

      - name: Build README laboratory
        run: python scripts/build_readme_lab.py

      - name: Run tests with JUnit evidence
        run: python -m pytest -q --junitxml=genbox-quality.xml

      - name: Reject empty or all-skipped test evidence
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("genbox-quality.xml").getroot()
          cases = root.findall(".//testcase")
          skipped = root.findall(".//skipped")
          if not cases or len(skipped) >= len(cases):
              raise SystemExit(f"invalid test evidence: cases={len(cases)} skipped={len(skipped)}")
          print(f"test evidence: cases={len(cases)} skipped={len(skipped)}")
          PY

      - name: Upload JUnit evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GenBox-quality-junit
          path: genbox-quality.xml
          retention-days: 7

      - name: Check whitespace errors
        run: git diff --check

      - name: Check generated artifact freshness
        run: git diff --exit-code

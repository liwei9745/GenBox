name: Build Docker Image

on:
  push:
    branches: [ "master", "dev" ]
    tags: [ "v*" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  release-contract:
    name: Validate release identity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Require tag to match packaged version
        if: github.ref_type == 'tag'
        run: >-
          python scripts/package_release.py
          --validate-release-tag "${{ github.ref_name }}"

  build:
    needs: release-contract
    runs-on: ubuntu-latest
    outputs:
      image_id: ${{ steps.build.outputs.imageid }}
      image_tags: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=sha,prefix=

      - name: Build Docker image once for smoke and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test exact built image runtime imports
        env:
          RELEASE_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_IMAGE_ID"
          docker image inspect "$RELEASE_IMAGE_ID" >/dev/null
          docker run --rm --entrypoint python "$RELEASE_IMAGE_ID" -c \
            "from importlib import metadata; from pathlib import Path; import aiofiles, asyncssh, bcrypt, cryptography, dotenv, fastapi, httpx, multipart, numpy, onnxruntime, PIL, psutil, pydantic, pydantic_settings, requests, typing_extensions, tzdata, uvicorn; assert metadata.version('bcrypt') == '5.0.0'; assert numpy.__version__ == '2.4.3'; assert onnxruntime.__version__ == '1.24.3'; assert Path('/app/THIRD_PARTY_NOTICES.md').is_file(); assert Path('/app/THIRD_PARTY_LICENSES/bcrypt/LICENSE').is_file(); passphrase = 'genbox-runtime-smoke-only'; private_key = asyncssh.generate_private_key('ssh-ed25519'); encrypted_key = private_key.export_private_key('openssh', passphrase); assert asyncssh.import_private_key(encrypted_key, passphrase).get_algorithm() == 'ssh-ed25519'; import main; print('docker runtime import smoke passed')"

      - name: Smoke test exact built image over HTTP
        timeout-minutes: 3
        env:
          RELEASE_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: bash .github/scripts/docker-release-http-smoke.sh

      - name: Save smoke-tested Docker image without rebuilding
        env:
          RELEASE_IMAGE_ID: ${{ steps.build.outputs.imageid }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_IMAGE_ID"
          docker image inspect "$RELEASE_IMAGE_ID" >/dev/null
          docker save --output "$RUNNER_TEMP/genbox-release-image.tar" "$RELEASE_IMAGE_ID"
          test -s "$RUNNER_TEMP/genbox-release-image.tar"

      - name: Upload exact smoke-tested Docker image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: genbox-release-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/genbox-release-image.tar
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  push:
    name: Push exact smoke-tested image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download exact smoke-tested Docker image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: genbox-release-image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/genbox-release-image

      - name: Load and verify exact smoke-tested Docker image
        env:
          RELEASE_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_IMAGE_ID"
          docker load --input "$RUNNER_TEMP/genbox-release-image/genbox-release-image.tar"
          test "$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE_ID")" = "$RELEASE_IMAGE_ID"

      - name: Log in to Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push smoke-tested Docker image without rebuilding
        env:
          IMAGE_TAGS: ${{ needs.build.outputs.image_tags }}
          RELEASE_IMAGE_ID: ${{ needs.build.outputs.image_id }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_IMAGE_ID"
          test "$(docker image inspect --format '{{.Id}}' "$RELEASE_IMAGE_ID")" = "$RELEASE_IMAGE_ID"
          pushed=0
          while IFS= read -r tag; do
            test -n "$tag" || continue
            docker tag "$RELEASE_IMAGE_ID" "$tag"
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$RELEASE_IMAGE_ID"
            docker push "$tag"
            pushed=$((pushed + 1))
          done <<< "$IMAGE_TAGS"
          test "$pushed" -gt 0
